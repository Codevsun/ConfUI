[package]
name = "confui"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A terminal TUI for browsing and editing config files (TOML, JSON, YAML) as an interactive tree"
license = "MIT"
repository = "https://github.com/Codevsun/ConfUI"
homepage = "https://github.com/Codevsun/ConfUI"
keywords = ["tui", "config", "toml", "json", "yaml", "editor", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
indexmap = "2.14.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "0.8.22"
toml_edit = "0.25.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
